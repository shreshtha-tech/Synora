# Render Blueprint — New + > Blueprint > pick this repo
databases:
  - name: synora-db
    plan: free            # free Postgres expires after 30 days; use basic-256mb+ for real use
    databaseName: synora
    user: synora

services:
  - type: keyvalue        # Redis
    name: synora-redis
    plan: free
    ipAllowList: []       # internal only
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: synora-backend
    runtime: docker
    # Paths are explicit from the repository root; COPY uses backend/ as context.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    plan: starter         # free tier (512MB) is likely too small for Prisma + PyMuPDF
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase: { name: synora-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: synora-redis, property: connectionString }
      - key: PINECONE_INDEX_NAME
        value: synora
      - key: PINECONE_ENV
        value: us-east-1
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: synora-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_URL     # build-time: https://synora-backend.onrender.com
        sync: false
      - key: API_URL                 # same value as above
        sync: false
      - key: NEXTAUTH_URL            # https://synora-frontend.onrender.com
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
